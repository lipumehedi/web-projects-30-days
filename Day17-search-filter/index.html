

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search & Filter Tasks | Day 17</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="todo-card">
            <h1>My Tasks</h1>
            <p class="subtitle">Search, organize, and complete your tasks.</p>

            <form id="taskForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a new task..."
                    maxlength="200"
                    required
                >
                <button type="submit">Add Task</button>
            </form>

            <input
                type="search"
                id="searchInput"
                placeholder="Search tasks..."
                aria-label="Search tasks"
            >

            <div class="filters" aria-label="Filter tasks">
                <button type="button" class="filter-btn active" data-filter="all">
                    All
                </button>
                <button type="button" class="filter-btn" data-filter="pending">
                    Pending
                </button>
                <button type="button" class="filter-btn" data-filter="completed">
                    Completed
                </button>
            </div>

            <p id="taskCount" aria-live="polite">0 tasks</p>

            <ul id="taskList"></ul>

            <p id="emptyMessage">No tasks found.</p>

            <button type="button" id="clearButton" class="clear-btn">
                Clear All Tasks
            </button>

            <p id="message" role="status" aria-live="polite"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
