
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager | Day 18</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="todo-card">
            <h1>Task Manager</h1>
            <p class="subtitle">Plan tasks and manage deadlines.</p>

            <form id="taskForm">
                <label for="taskInput">Task name</label>
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a task..."
                    maxlength="200"
                    required
                >

                <label for="dueDate">Due date</label>
                <input type="date" id="dueDate">

                <button type="submit" id="submitButton">Add Task</button>
                <button type="button" id="cancelButton" hidden>
                    Cancel Edit
                </button>
            </form>

            <input
                type="search"
                id="searchInput"
                placeholder="Search tasks..."
                aria-label="Search tasks"
            >

            <div class="filters">
                <button type="button" class="filter-btn active" data-filter="all">
                    All
                </button>
                <button type="button" class="filter-btn" data-filter="pending">
                    Pending
                </button>
                <button type="button" class="filter-btn" data-filter="completed">
                    Completed
                </button>
            </div>

            <p id="taskCount" aria-live="polite"></p>
            <ul id="taskList"></ul>
            <p id="emptyMessage" hidden>No tasks found.</p>
            <p id="message" role="status" aria-live="polite"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
